services:
  - type: web
    name: capstone-alpr-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: capstone-alpr-db
          property: connectionString
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
  - type: worker
    name: capstone-alpr-traffic-scheduler
    runtime: python
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: python -m app.traffic_scheduler
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: capstone-alpr-db
          property: connectionString
      - key: APP_ENV
        value: production
databases:
  - name: capstone-alpr-db
    plan: free
