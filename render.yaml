services:
  - type: web
    name: capstone-alpr-api
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | sed -e 's|^postgres://|postgresql+psycopg://|' -e 's|^postgresql://|postgresql+psycopg://|')" && alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: capstone-alpr-db
          property: connectionString
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
databases:
  - name: capstone-alpr-db
    plan: free
